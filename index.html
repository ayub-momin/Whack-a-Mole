<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>
<style>
  :root {
    --bg: #1b1023;
    --hole: #2e1a3e;
    --hole-edge: #4a2c63;
    --accent: #ffb454;
    --accent2: #ff6b8b;
    --text: #f5e9ff;
    --success: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a1636, var(--bg));
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    user-select: none;
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 1px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.subtitle {
    color: #c7b3d9;
    margin-bottom: 20px;
    font-size: 0.95rem;
    text-align: center;
  }

  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }

  .stats div {
    background: #2a1836;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid #45285c;
  }

  .stats span {
    color: var(--accent);
    font-weight: 700;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    width: min(90vw, 380px);
  }

  .hole {
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 60%, var(--hole), #1b0f26 80%);
    border-radius: 50%;
    border: 4px solid var(--hole-edge);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .mole {
    position: absolute;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.4rem;
    transition: bottom 0.15s ease-out;
  }

  .hole.up .mole {
    bottom: 8%;
  }

  .hole.whacked .mole {
    animation: whack 0.25s ease;
  }

  @keyframes whack {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.3) rotate(15deg); }
    100% { transform: translateX(-50%) scale(0.6); opacity: 0; }
  }

  button#startBtn {
    margin-top: 26px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #221;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    transition: transform 0.15s;
  }

  button#startBtn:hover { transform: translateY(-2px); }
  button#startBtn:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }

  .end-message {
    margin-top: 18px;
    font-size: 1.1rem;
    color: var(--success);
    font-weight: 700;
    text-align: center;
    min-height: 1.4em;
  }
</style>
</head>
<body>

<h1>Whack-a-Mole</h1>
<p class="subtitle">Click the moles before they duck back down!</p>

<div class="stats">
  <div>Score: <span id="score">0</span></div>
  <div>Time: <span id="time">30</span>s</div>
</div>

<div class="board" id="board"></div>

<div class="end-message" id="endMsg"></div>
<button id="startBtn">Start Game</button>

<script>
  const HOLE_COUNT = 9;
  const GAME_LENGTH = 30;
  const moleEmojis = ['🐹','🐹','🐹','🦔']; // occasional bonus mole

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('startBtn');
  const endMsg = document.getElementById('endMsg');

  let holes = [];
  let score = 0;
  let timeLeft = GAME_LENGTH;
  let gameTimer = null;
  let moleTimer = null;
  let running = false;

  function buildHoles() {
    board.innerHTML = '';
    holes = [];
    for (let i = 0; i < HOLE_COUNT; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.innerHTML = `<div class="mole"></div>`;
      hole.addEventListener('click', () => whack(hole));
      board.appendChild(hole);
      holes.push(hole);
    }
  }

  function randomDelay(min, max) {
    return Math.random() * (max - min) + min;
  }

  function popMole() {
    if (!running) return;

    holes.forEach(h => h.classList.remove('up', 'whacked'));

    const idx = Math.floor(Math.random() * HOLE_COUNT);
    const hole = holes[idx];
    const emoji = moleEmojis[Math.floor(Math.random() * moleEmojis.length)];
    hole.querySelector('.mole').textContent = emoji;
    hole.dataset.value = emoji === '🦔' ? 3 : 1;
    hole.classList.add('up');

    const upTime = randomDelay(600, 1000);
    moleTimer = setTimeout(() => {
      hole.classList.remove('up');
      if (running) moleTimer = setTimeout(popMole, randomDelay(200, 500));
    }, upTime);
  }

  function whack(hole) {
    if (!running || !hole.classList.contains('up') || hole.classList.contains('whacked')) return;
    hole.classList.add('whacked');
    hole.classList.remove('up');
    score += parseInt(hole.dataset.value || '1', 10);
    scoreEl.textContent = score;
    clearTimeout(moleTimer);
    moleTimer = setTimeout(popMole, randomDelay(200, 500));
  }

  function startGame() {
    buildHoles();
    score = 0;
    timeLeft = GAME_LENGTH;
    scoreEl.textContent = '0';
    timeEl.textContent = GAME_LENGTH;
    endMsg.textContent = '';
    running = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Playing...';

    popMole();

    gameTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    clearInterval(gameTimer);
    clearTimeout(moleTimer);
    holes.forEach(h => h.classList.remove('up', 'whacked'));
    startBtn.disabled = false;
    startBtn.textContent = 'Play Again';
    endMsg.textContent = `⏰ Time's up! Final score: ${score}`;
  }

  startBtn.addEventListener('click', startGame);

  buildHoles();
</script>

</body>
</html>
